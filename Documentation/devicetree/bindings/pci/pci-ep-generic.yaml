%YAML 1.2
---
$id: http://devicetree.org/schemas/pci/pci-ep-generic.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Generic PCI Endpoint Controller

maintainers:
  - Manivannan Sadhasivam <mani@kernel.org>

description:
  A PCI Endpoint Controller that is initialised by firmware or provided by an
  emulation, and is configured through a memory-mapped control region.

properties:
  compatible:
    const: pci-ep-generic

  reg:
    items:
      - description: control region
      - description: outbound window

  reg-names:
    items:
      - const: ctrl
      - const: outbound

required:
  - compatible
  - reg
  - reg-names

allOf:
  - $ref: pci-ep.yaml#

unevaluatedProperties: false

examples:
  - |
    pcie-ep@10000000 {
        compatible = "pci-ep-generic";
        reg = <0x10000000 0x1000>,
              <0x20000000 0x8000000>;
        reg-names = "ctrl", "outbound";
    };
...
